# VS test-host dependencies. sonic-swss owns the shared VS test stack, so this
# is the single package list used by its run-vs-tests template.

packages:
  # Python test runner and helpers.
  - { name: pytest, type: pip }
  - { name: flaky, type: pip }
  - { name: exabgp, type: pip }
  - { name: docker, type: pip }
  - { name: lcov_cobertura, type: pip }
  - { name: wheel, type: pip }
  - name: libyang==3.3.0
    type: pip
    pip_args: [--no-build-isolation]
    requires: [libyang3, python3-cffi, python3-dev, wheel]

  # Common VS/DVS and KVM host packages (union of the three existing templates).
  - python3-pip
  - libvirt-clients
  - qemu
  - openvswitch-switch
  - net-tools
  - bridge-utils
  - vlan
  - python3-libvirt
  - libzmq3-dev
  - libzmq5
  - libhiredis0.14
  - libpcre3-dev
  - python3-redis
  - python3-cffi
  - python3-dev
  - uuid-dev
  - parallel
