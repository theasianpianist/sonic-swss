parameters:
- name: repo
  type: string
  default: self

- name: arch
  type: string
  values:
  - amd64
  - armhf
  - arm64
  default: amd64

- name: pool
  type: string
  values:
  - sonicso1ES-amd64
  - sonicso1ES-armhf
  - sonicso1ES-arm64
  - default
  default: default

- name: timeout
  type: number
  default: 90

- name: artifact_name
  type: string

- name: archive_pytests
  type: boolean
  default: false

- name: archive_gcov
  type: boolean
  default: false

- name: asan
  type: boolean
  default: false

- name: staged_upstreams
  # List of {artifact: <current-run AZP artifact>, name: <upstream YAML name>}.
  # Reusers stage same-run sairedis/swss-common bundles for the cascade.
  type: object
  default: []

- name: debian_version
  type: string
  default: bookworm

jobs:
- job:
  displayName: ${{ parameters.arch }}
  timeoutInMinutes: ${{ parameters.timeout }}

  pool:
    ${{ if ne(parameters.pool, 'default') }}:
      name: ${{ parameters.pool }}
    ${{ else }}:
      vmImage: 'ubuntu-22.04'

  container:
    image: sonicdev-microsoft.azurecr.io:443/sonic-slave-${{ parameters.debian_version }}:$(BUILD_BRANCH)-${{ parameters.arch }}

  steps:
  - checkout: ${{ parameters.repo }}
    clean: true
    submodules: true

  # Compile-time resource ref (resolved above from BUILD_BRANCH) fails the run
  # up front if the branch doesn't exist, instead of discovering it at runtime.
  - checkout: sonic_swss_common
    clean: true

  - ${{ if eq(parameters.repo, 'self') }}:
    - template: merge-target-branch.yml

  - ${{ each up in parameters.staged_upstreams }}:
    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: ${{ up.artifact }}
        path: $(Pipeline.Workspace)/staged/${{ up.name }}
      displayName: "Stage current-run ${{ up.name }} for the cascade"

  - script: |
      set -ex
      sudo apt-get update
      sudo apt-get install -qq -y python3-yaml python3-requests jq

      REQ_ARGS=$(echo "$STAGED_UPSTREAMS_JSON" \
        | jq -r '.[] | .name' \
        | xargs -I{} echo --required-staged-upstream {} \
        | tr '\n' ' ')
      PYTHONPATH=$(Pipeline.Workspace)/sonic_swss_common/ci python3 -m buildenv_setup \
        --repo-dir $(Build.SourcesDirectory) \
        --scope build \
        --arch ${{ parameters.arch }} \
        --debian-version ${{ parameters.debian_version }} \
        --branch "$(BUILD_BRANCH)" \
        --upstream-staged-dir $(Pipeline.Workspace)/staged \
        $REQ_ARGS
    displayName: "Set up build environment (buildenv_setup)"
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      STAGED_UPSTREAMS_JSON: ${{ convertToJson(parameters.staged_upstreams) }}

  - ${{ if eq(parameters.archive_pytests, true) }}:
    - script: |
        set -ex
        tar czf $(Build.ArtifactStagingDirectory)/pytest.tgz tests
      displayName: "Archive SWSS pytest sources"

  - script: GCOV=${{ parameters.archive_gcov }} ASAN=${{ parameters.asan }} ./build-env/build.sh
    displayName: "Compile and test sonic-swss"

  - task: PublishTestResults@2
    inputs:
      testResultsFiles: '**/*_tr.xml'
      testRunTitle: gtest
    condition: and(succeededOrFailed(), eq('${{ parameters.asan }}', false))

  - publish: $(System.DefaultWorkingDirectory)/
    artifact: ${{ parameters.artifact_name }}
    displayName: "Archive swss debian packages"

  - publish: $(Build.ArtifactStagingDirectory)/
    artifact: sonic-swss-pytests
    displayName: "Archive swss pytests"
    condition: eq('${{ parameters.archive_pytests }}', true)
